<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b2a1b" />
<title>Survival Tower Defense</title>
<style>
  :root { color-scheme: dark; --bg:#1b2a1b; --panel:#24382a; --ink:#f2f5ee; --accent:#e0b13a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  #game { position:fixed; inset:0; } #game canvas { display:block; }
  #safe-probe { position:fixed; visibility:hidden; pointer-events:none; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #menu { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)); overflow:auto; touch-action:auto; z-index:10; }
  #menu[hidden], #hud[hidden] { display:none; }
  .card { width:min(420px,100%); background:var(--panel); border-radius:14px; padding:20px; display:grid; gap:12px; box-shadow:0 8px 30px #0006; }
  h1 { margin:0; font-size:22px; letter-spacing:.5px; } label { font-size:13px; opacity:.85; display:grid; gap:6px; }
  input[type=text] { font:inherit; padding:12px; border-radius:8px; border:1px solid #ffffff30; background:#0003; color:var(--ink); user-select:text; -webkit-user-select:text; }
  button { font:inherit; padding:12px 14px; border-radius:8px; border:0; background:#ffffff18; color:var(--ink); min-height:44px; }
  button.primary { background:var(--accent); color:#2b1f06; font-weight:700; }
  #swatches { display:flex; gap:8px; flex-wrap:wrap; } #swatches button { width:40px; height:40px; min-height:0; padding:0; border-radius:50%; border:3px solid transparent; }
  #swatches button.sel { border-color:#fff; } .row { display:flex; gap:8px; } .row > * { flex:1; }
  #err { color:#ff8a80; min-height:1.2em; font-size:13px; } small { opacity:.7; }
  #hud { position:fixed; z-index:5; left:max(8px,env(safe-area-inset-left)); top:max(8px,env(safe-area-inset-top)); display:flex; gap:6px; align-items:center; background:#0008; padding:4px 6px; border-radius:10px; font-size:12px; touch-action:auto; }
  #hud button { min-height:34px; padding:4px 10px; font-size:12px; } #hudid { font-family:monospace; }
  #toast { position:fixed; z-index:20; left:50%; top:calc(max(8px,env(safe-area-inset-top)) + 54px); transform:translateX(-50%); max-width:min(92vw,420px); padding:10px 14px; border-radius:10px; font-weight:700; text-align:center; font-size:14px; pointer-events:none; }
  #toast.err { background:#b3261ee6; } #toast.ok { background:#2e7d32e6; } #toast[hidden],#tpanel[hidden],#skillmodal[hidden]{display:none;}
  #tpanel { position:fixed; z-index:6; left:50%; transform:translateX(-50%); bottom:calc(max(8px,env(safe-area-inset-bottom)) + 150px); width:min(330px,calc(100vw - 16px)); background:#14221bf2; border:1px solid #ffffff30; border-radius:12px; padding:10px; display:grid; gap:8px; font-size:13px; touch-action:manipulation; }
  #tpanel .th { display:flex; gap:8px; align-items:center; } #tpanel .th b { flex:1; font-size:15px; } #tlv { color:var(--accent); font-weight:700; } #tclose { min-height:32px; padding:2px 10px; }
  #tstats div { display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px solid #ffffff12; } #tstats i { color:#7ddc7d; font-style:normal; }
  .chip { display:inline-block; border:1px solid; border-radius:99px; padding:2px 8px; margin:0 4px 4px 0; font-size:12px; } .sk { margin-top:4px; opacity:.9; font-size:12px; }
  #tup.poor { opacity:.6; } #tup:disabled { opacity:.5; } #tsell.warn { background:#b3261e; } #tpick { background:var(--accent); color:#2b1f06; font-weight:700; }
  #skillmodal { position:fixed; inset:0; z-index:30; background:#000b; display:flex; align-items:center; justify-content:center; padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); overflow:auto; touch-action:pan-y; }
  .sm { width:min(760px,100%); display:grid; gap:10px; } .sm h2 { margin:0; } #smcards { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
  .card { text-align:left; display:grid; gap:6px; padding:12px; border:2px solid var(--c); background:#14221b; border-radius:12px; } .card:disabled { opacity:.45; } .card .ic { font-size:34px; } .card small { opacity:.8; } .card .tier { color:var(--c); font-weight:700; font-size:13px; } .card .st { display:grid; gap:2px; font-size:12px; opacity:.9; }
  #pauseov,#endmodal { position:fixed; inset:0; z-index:40; background:#000a; display:flex; align-items:center; justify-content:center; padding:16px; touch-action:auto; }
  #pauseov[hidden],#endmodal[hidden]{display:none;} #endstats { display:grid; gap:4px; } #endstats div { display:flex; justify-content:space-between; border-bottom:1px solid #ffffff18; padding:3px 0; }
  #mp { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)); overflow:auto; touch-action:auto; z-index:11; } #mp[hidden]{display:none;}
  #mplobby[hidden],#mpconnect[hidden]{display:none;} #mpconnect,#mplobby { display:grid; gap:10px; } .errline { color:#ff8a80; min-height:1.2em; font-size:13px; } .big { font-family:monospace; font-size:22px; letter-spacing:2px; color:var(--accent); }
  .pl { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #ffffff14; } .pl i { width:16px; height:16px; border-radius:50%; border:2px solid #fff8; } .pl span { margin-left:auto; color:#ff8a80; font-size:12px; }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; } .swatches button { width:40px; height:40px; min-height:0; padding:0; border-radius:50%; border:3px solid transparent; } .swatches button.sel { border-color:#fff; } .swatches button:disabled { opacity:.25; }
  .chk { display:flex; align-items:center; gap:8px; } #netstat { position:fixed; z-index:25; left:50%; top:calc(max(8px,env(safe-area-inset-top)) + 54px); transform:translateX(-50%); background:#b3261ee6; padding:8px 14px; border-radius:10px; font-weight:700; } #netstat[hidden]{display:none;}
</style>
</head>
<body>
<div id="safe-probe"></div>
<div id="game"></div>
<div id="hud" hidden><button id="pausebtn" type="button" aria-label="Tạm dừng">⏸</button><span id="hudid"></span><button id="copy" type="button">Chép mã</button><button id="back" type="button">Menu</button></div>
<div id="toast" hidden></div>
<div id="tpanel" hidden>
  <div class="th"><b id="tname"></b><span id="tlv"></span><button id="tclose" type="button" aria-label="Đóng">✕</button></div>
  <div id="tstats"></div><div id="tbranches"></div>
  <button id="tpick" type="button" hidden></button><button id="tup" type="button"></button>
  <div class="row"><button id="tsell" type="button"></button><button id="treset" type="button" hidden></button></div>
</div>
<div id="skillmodal" hidden><div class="sm"><h2>Chọn nhánh kỹ năng</h2><p id="smsub"></p><div id="smcards"></div><button id="smclose" type="button">Để sau</button></div></div>
<div id="pauseov" hidden><div class="card"><h2>Tạm dừng</h2><button id="resume" class="primary" type="button">Tiếp tục</button></div></div>
<div id="endmodal" hidden><div class="card"><h2 id="endtitle"></h2><p id="endsub"></p><div id="endstats"></div><div class="row"><button id="endmenu" type="button">Về menu</button><button id="endretry" class="primary" type="button">Chơi lại bản đồ này</button></div></div></div>
<div id="netstat" hidden></div>
<div id="mp" hidden><div class="card">
  <h1>Nhiều người chơi</h1>
  <div id="mpconnect">
    <label>Địa chỉ máy chủ<input id="srvurl" type="text" placeholder="ws://192.168.1.10:8080/ws hoặc wss://ten-mien/ws" autocomplete="off" autocapitalize="off" /></label>
    <small>Cần một máy chủ đang chạy (xem README). Thử trên Wi-Fi nhà: chạy máy chủ trên máy tính rồi nhập ws://&lt;IP máy tính&gt;:8080/ws.</small>
    <label>Mã phòng (để vào phòng của bạn bè)<input id="roomcode" type="text" placeholder="K7QM2X" maxlength="6" autocapitalize="characters" autocomplete="off" /></label>
    <div id="mperr" class="errline"></div>
    <div class="row"><button id="mpcreate" type="button">Tạo phòng</button><button id="mpjoin" class="primary" type="button">Vào phòng</button></div>
    <button id="mpback" type="button">Quay lại</button>
  </div>
  <div id="mplobby" hidden>
    <div class="row"><div>Mã phòng: <b id="lcode" class="big"></b></div><button id="lcopy" type="button">Chép mã</button><button id="lshare" type="button">Mời bạn</button></div>
    <div id="lplayers"></div>
    <label>Màu áo (không trùng với người khác)<div id="lswatches" class="swatches"></div></label>
    <label>Mã bản đồ<input id="lmapid" type="text" autocomplete="off" /></label>
    <div class="row"><button id="lmapset" type="button">Đặt bản đồ</button><button id="lmaprand" type="button">Ngẫu nhiên</button></div>
    <label class="chk"><input id="lrespawn" type="checkbox" /> Cho phép hồi sinh (thua khi cả đội cùng bị hạ)</label>
    <div id="lerr" class="errline"></div><small id="lhint"></small>
    <div class="row"><button id="lleave" type="button">Rời phòng</button><button id="lstart" class="primary" type="button">Bắt đầu</button></div>
  </div>
</div></div>
<div id="menu">
  <div class="card">
    <h1>Survival Tower Defense</h1>
    <label>Tên nhân vật<input id="name" type="text" autocomplete="off" /></label>
    <label>Màu áo (cũng là màu của bạn trên minimap)<div id="swatches"></div></label>
    <label>Mã bản đồ (để trống = ngẫu nhiên)<input id="mapid" type="text" placeholder="FOREST-2026-A8F72K" autocapitalize="characters" autocomplete="off" /></label>
    <div id="err"></div>
    <div class="row"><button id="random" type="button">Tạo mã ngẫu nhiên</button><button id="start" class="primary" type="button">Chơi đơn</button></div>
    <button id="mpbtn" type="button">👥 Nhiều người chơi</button>
    <small id="best"></small><small>Phiên bản 0.5 – Giai đoạn 5: nhiều người chơi (cần máy chủ, xem README). Chưa có âm thanh.</small>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
