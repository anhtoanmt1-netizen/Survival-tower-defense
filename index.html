<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b2a1b" />
<title>Survival Tower Defense</title>
<style>
  :root { color-scheme: dark; --bg:#1b2a1b; --panel:#24382a; --panel2:#1a2b21; --ink:#f2f5ee; --accent:#e0b13a; --accent2:#a9801c; --line:#e0b13a66; --ok:#7ddc7d; --bad:#ff6b6b; --font:'Montserrat',system-ui,sans-serif; }
  html,body { margin:0; height:100%; background:#000; color:var(--ink); font-family:var(--font); overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  button,input,select { font-family:inherit; }
  /* #stage: khung hiển thị. Chế độ ngang với tỷ lệ 19.5:9 / 16:9 sẽ được co lại và căn giữa bằng JS (ui/screen.js). */
  #stage { position:fixed; left:0; top:0; width:100%; height:100%; overflow:hidden; background:var(--bg); }
  #game { position:absolute; inset:0; } #game canvas { display:block; }
  #safe-probe { position:fixed; visibility:hidden; pointer-events:none; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #menu { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 90% at 50% 0%,#2d4a35,var(--bg)); padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)); overflow:auto; touch-action:pan-y; z-index:10; }
  #menu[hidden], #hud[hidden], #settings[hidden], #toast[hidden],#tpanel[hidden],#skillmodal[hidden],#pauseov[hidden],#endmodal[hidden] { display:none; }
  .card { width:min(440px,100%); background:linear-gradient(180deg,var(--panel),var(--panel2)); border:2px solid var(--line); border-radius:16px; padding:20px; display:grid; gap:12px; box-shadow:0 10px 34px #000a, inset 0 0 0 1px #0007, inset 0 1px 0 #ffffff1c; animation:pop .22s ease-out; }
  @keyframes pop { from { transform:translateY(10px) scale(.97); opacity:0; } to { transform:none; opacity:1; } }
  h1 { margin:0; font-size:23px; font-weight:800; letter-spacing:.3px; } h2 { margin:0; font-weight:800; } h3 { margin:0 0 6px; font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.4px; text-transform:uppercase; }
  label { font-size:13px; font-weight:500; opacity:.9; display:grid; gap:6px; }
  input[type=text] { font:inherit; font-weight:500; padding:12px; border-radius:10px; border:1.5px solid #ffffff2a; background:#0004; color:var(--ink); user-select:text; -webkit-user-select:text; transition:border-color .15s; } input[type=text]:focus { outline:none; border-color:var(--accent); }
  button { font:inherit; font-weight:600; padding:12px 14px; border-radius:10px; border:0; border-bottom:3px solid #0006; background:linear-gradient(180deg,#ffffff24,#ffffff10); color:var(--ink); min-height:44px; cursor:pointer; transition:transform .08s,filter .15s,background .15s; }
  button:hover { filter:brightness(1.12); } button:active { transform:translateY(2px); border-bottom-width:1px; } button:disabled { opacity:.45; cursor:default; filter:none; transform:none; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.primary { background:linear-gradient(180deg,#f3cd5c,var(--accent) 55%,var(--accent2)); color:#2b1f06; font-weight:800; border-bottom-color:#5a4210; }
  #swatches { display:flex; gap:8px; flex-wrap:wrap; } #swatches button { width:40px; height:40px; min-height:0; padding:0; border-radius:50%; border:3px solid transparent; box-shadow:0 2px 0 #0006; transition:transform .12s,border-color .12s; }
  #swatches button.sel { border-color:#fff; transform:scale(1.12); } .row { display:flex; gap:8px; } .row > * { flex:1; }
  #err { color:var(--bad); min-height:1.2em; font-size:13px; font-weight:600; } small { opacity:.75; font-weight:500; }
  /* chọn độ khó */
  #diffs { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .diff { --c:#fff; display:grid; gap:2px; justify-items:center; padding:8px 2px; min-height:0; font-size:11px; font-weight:700; border:2px solid #ffffff1e; border-radius:12px; background:#0003; }
  .diff .ic { font-size:20px; line-height:1.1; } .diff.sel { border-color:var(--c); background:linear-gradient(180deg,color-mix(in srgb,var(--c) 28%,transparent),#0003); box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent); transform:translateY(-2px); }
  #diffdesc { min-height:2.6em; font-size:12px; font-weight:500; line-height:1.35; } #diffdesc b { color:var(--c,#fff); }
  /* HUD DOM */
  #hud { position:absolute; z-index:5; left:max(8px,env(safe-area-inset-left)); top:max(8px,env(safe-area-inset-top)); display:flex; gap:6px; align-items:center; background:#10180fb8; border:1.5px solid var(--line); padding:4px 6px; border-radius:12px; font-size:12px; font-weight:600; touch-action:auto; backdrop-filter:blur(3px); }
  #hud button { min-height:34px; padding:4px 10px; font-size:12px; border-radius:8px; } #hudid { font-family:ui-monospace,monospace; font-weight:600; }
  #toast { position:absolute; z-index:20; left:50%; top:calc(max(8px,env(safe-area-inset-top)) + 54px); transform:translateX(-50%); max-width:min(92%,440px); padding:10px 16px; border-radius:12px; font-weight:700; text-align:center; font-size:13px; pointer-events:none; border:1.5px solid #fff3; box-shadow:0 6px 18px #0008; animation:pop .18s ease-out; }
  #toast.err { background:#b3261ef0; } #toast.ok { background:#2e7d32f0; }
  #tpanel { position:absolute; z-index:6; left:50%; transform:translateX(-50%); bottom:calc(max(8px,env(safe-area-inset-bottom)) + 150px); width:min(330px,calc(100% - 16px)); background:linear-gradient(180deg,#1d3126f4,#12201af4); border:2px solid var(--line); border-radius:14px; padding:10px; display:grid; gap:8px; font-size:13px; font-weight:500; touch-action:manipulation; box-shadow:0 8px 26px #000a; animation:pop .16s ease-out; }
  #tpanel .th { display:flex; gap:8px; align-items:center; } #tpanel .th b { flex:1; font-size:15px; font-weight:800; } #tlv { color:var(--accent); font-weight:800; } #tclose { min-height:32px; padding:2px 10px; }
  #tstats div { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid #ffffff14; } #tstats i { color:#7ddc7d; font-style:normal; }
  .chip { display:inline-block; border:1.5px solid; border-radius:99px; padding:2px 8px; margin:0 4px 4px 0; font-size:12px; font-weight:600; } .sk { margin-top:4px; opacity:.92; font-size:12px; }
  #tup.poor { opacity:.6; } #tup:disabled { opacity:.5; } #tsell.warn { background:#b3261e; } #tpick { background:linear-gradient(180deg,#f3cd5c,var(--accent)); color:#2b1f06; font-weight:800; }
  @media (orientation:landscape) and (max-height:560px) { #tpanel { top:8px; bottom:8px; left:50%; width:min(320px,34%); overflow-y:auto; align-content:start; } }
  #skillmodal, #pauseov, #endmodal, #settings { position:absolute; inset:0; background:#000b; display:flex; align-items:center; justify-content:center; padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); overflow:auto; }
  #skillmodal { z-index:30; touch-action:pan-y; } #pauseov,#endmodal { z-index:40; touch-action:auto; } #settings { z-index:60; touch-action:pan-y; }
  .sm { width:min(760px,100%); display:grid; gap:10px; } #smcards { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
  .card.pick { text-align:left; display:grid; gap:6px; padding:12px; border:2px solid var(--c); background:#14221b; border-radius:12px; } .card.pick:disabled { opacity:.45; } .card .ic { font-size:34px; } .card small { opacity:.8; } .card .tier { color:var(--c); font-weight:700; font-size:13px; } .card .st { display:grid; gap:2px; font-size:12px; opacity:.9; }
  #endstats { display:grid; gap:4px; } #endstats div { display:flex; justify-content:space-between; border-bottom:1px solid #ffffff18; padding:3px 0; }
  /* Menu cài đặt */
  .sheet { width:min(460px,100%); max-height:100%; overflow:auto; background:linear-gradient(180deg,var(--panel),var(--panel2)); border:2px solid var(--line); border-radius:16px; padding:16px; display:grid; gap:14px; box-shadow:0 10px 34px #000a; animation:pop .2s ease-out; touch-action:pan-y; }
  .sheet header { display:flex; align-items:center; gap:8px; } .sheet header h2 { flex:1; font-size:19px; } .sheet section { display:grid; gap:8px; padding:10px; border-radius:12px; background:#0003; border:1px solid #ffffff12; }
  .line { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font-size:13px; font-weight:600; } .line output { min-width:3ch; text-align:right; font-weight:700; color:var(--accent); font-size:12px; }
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; } .seg button { min-height:40px; font-size:12px; padding:8px 6px; border:2px solid transparent; } .seg button.sel { border-color:var(--accent); background:linear-gradient(180deg,#e0b13a40,#e0b13a18); color:#fff3c8; }
  .switch { position:relative; width:46px; height:26px; min-height:0; padding:0; border-radius:99px; background:#0006; border:2px solid #ffffff2a; } .switch::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#ddd; transition:transform .15s,background .15s; } .switch.on { background:#2e7d32; border-color:#7ddc7d88; } .switch.on::after { transform:translateX(20px); background:#fff; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:26px; background:transparent; touch-action:pan-y; } input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:99px; background:linear-gradient(90deg,var(--accent) var(--p,50%),#0007 var(--p,50%)); border:1px solid #ffffff22; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; margin-top:-9px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,#e8d9a8 60%,#a98a38); border:2px solid #5a4210; box-shadow:0 2px 4px #0008; }
  input[type=range]::-moz-range-track { height:8px; border-radius:99px; background:#0007; } input[type=range]::-moz-range-progress { height:8px; border-radius:99px; background:var(--accent); } input[type=range]::-moz-range-thumb { width:20px; height:20px; border-radius:50%; background:#e8d9a8; border:2px solid #5a4210; }
  .hint { font-size:12px; opacity:.8; font-weight:500; line-height:1.35; } .hint.warn { color:#ffcf6b; opacity:1; }
</style>
</head>
<body>
<div id="safe-probe"></div>
<div id="stage">
<div id="game"></div>
<div id="hud" hidden><button id="pausebtn" type="button" aria-label="Tạm dừng">⏸</button><span id="hudid"></span><button id="copy" type="button">Chép mã</button><button id="hudset" type="button" aria-label="Cài đặt">⚙</button><button id="back" type="button">Menu</button></div>
<div id="toast" hidden></div>
<div id="tpanel" hidden>
  <div class="th"><b id="tname"></b><span id="tlv"></span><button id="tclose" type="button" aria-label="Đóng">✕</button></div>
  <div id="tstats"></div><div id="tbranches"></div>
  <button id="tpick" type="button" hidden></button><button id="tup" type="button"></button>
  <div class="row"><button id="tsell" type="button"></button><button id="treset" type="button" hidden></button></div>
</div>
<div id="skillmodal" hidden><div class="sm"><h2>Chọn nhánh kỹ năng</h2><p id="smsub"></p><div id="smcards"></div><button id="smclose" type="button">Để sau</button></div></div>
<div id="pauseov" hidden><div class="card"><h2>Tạm dừng</h2><button id="resume" class="primary" type="button">Tiếp tục</button><button id="pauseset" type="button">⚙ Cài đặt</button></div></div>
<div id="endmodal" hidden><div class="card"><h2 id="endtitle"></h2><p id="endsub"></p><div id="endstats"></div><div class="row"><button id="endmenu" type="button">Về menu</button><button id="endretry" class="primary" type="button">Chơi lại bản đồ này</button></div></div></div>
<div id="settings" hidden><div class="sheet"><header><h2>⚙ Cài đặt</h2><button id="setclose" type="button" aria-label="Đóng">✕</button></header><div id="setbody" style="display:grid;gap:12px"></div></div></div>
<div id="menu">
  <div class="card">
    <h1>Survival Tower Defense</h1>
    <label>Tên nhân vật<input id="name" type="text" autocomplete="off" /></label>
    <label>Màu áo (cũng là màu của bạn trên minimap)<div id="swatches"></div></label>
    <label>Độ khó<div id="diffs"></div><span id="diffdesc"></span></label>
    <label>Mã bản đồ (để trống = ngẫu nhiên)<input id="mapid" type="text" placeholder="FOREST-2027-A8F72K" autocapitalize="characters" autocomplete="off" /></label>
    <div id="err"></div>
    <div class="row"><button id="random" type="button">Tạo mã ngẫu nhiên</button><button id="start" class="primary" type="button">Bắt đầu</button></div>
    <button id="menuset" type="button">⚙ Cài đặt (âm thanh, màn hình, camera)</button>
    <small id="best"></small><small>Phiên bản 0.5 – âm thanh, 5 độ khó, bản đồ mới, tháp tiến hóa, màn hình ngang. Chưa có multiplayer.</small>
  </div>
</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
