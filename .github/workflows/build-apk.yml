name: Build Android APK
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Kiểm thử (bản đồ, Map ID, A*)
        run: npm test
      - run: npm run build
      - name: Tạo dự án Android (nếu chưa có)
        run: '[ -d android ] || npx cap add android'
      - name: Vá AndroidManifest (quyền rung, link mời)
        run: node tools/patch-manifest.mjs
      - run: npx cap sync android
      - name: Build APK debug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: survival-tower-defense-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
