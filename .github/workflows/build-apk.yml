name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Cài export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/templates/4.3.stable ]; then
            mv /root/.local/share/godot/templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          fi
          ls ~/.local/share/godot/export_templates

      - name: Tạo debug keystore và cấu hình Android
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore /root/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cp ci/editor_settings-4.tres ~/.config/godot/editor_settings-4.tres

      - name: Import project
        run: godot --headless --import || true

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/survival-tower-defense.apk

      - uses: actions/upload-artifact@v4
        with:
          name: survival-tower-defense-apk
          path: build/*.apk
