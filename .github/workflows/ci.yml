name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --import || true
      - name: Run map generation tests
        run: godot --headless --script res://tests/map_generation/run_tests.gd
